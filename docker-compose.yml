services:
  mongodb:
    image: mongo
    container_name: mongo_db
    ports:
      - 27017:27017
    volumes:
      - mongo:/data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=yash
      - MONGO_INITDB_ROOT_PASSWORD=Yash@3221
    networks:
      - mongo-network
  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=yash
      - ME_CONFIG_MONGODB_ADMINPASSWORD=Yash@3221
      - ME_CONFIG_MONGODB_URL=mongodb://yash:Yash@3221@mongodb:27017/
    networks:
      - mongo-network
    depends_on:
      - mongodb
volumes:
  mongo: {}

networks:
  mongo-network:
    driver: bridge